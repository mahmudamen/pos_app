# Cutover vhost for xamltech.com (origin 173.249.56.66).
#
# Cloudflare terminates the public TLS certificate and speaks plain HTTP to
# this origin (Flexible), so the block listens on :80 and the app is told the
# original scheme via X-Forwarded-Proto.
#
# To roll back, restore the previous block, which proxied / to Odoo:
#     upstream xamltech.com { server 127.0.0.1:9019; }
#     location / { proxy_pass http://xamltech.com; }
#
# Install:
#   install -m644 nginx-xamltech.conf /etc/nginx/conf.d/xamltech.conf
#   nginx -t && systemctl reload nginx

upstream xamltech-site {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    server_name xamltech.com www.xamltech.com;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    client_max_body_size 4M;
    proxy_read_timeout   30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout   30s;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The Go app serves robots.txt, llms.txt, the Google verify file, the
    # sitemap, manifest and service worker itself, so everything proxies.
    location / {
        proxy_redirect http://xamltech.com/  https://xamltech.com/;
        proxy_redirect http://www.xamltech.com/ https://xamltech.com/;
        proxy_pass http://xamltech-site;
    }
}
