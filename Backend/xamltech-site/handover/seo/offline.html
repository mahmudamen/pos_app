<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — XamlTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070A14;--text:#F1F1F3;--text2:rgba(255,255,255,0.55);--accent:#00ADEE}
@media(prefers-color-scheme:light){:root{--bg:#f5f7fa;--text:#1a1d26;--text2:rgba(0,0,0,0.55)}}
body{background:var(--bg);color:var(--text);font-family:'Cairo',-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.wrap{max-width:480px}
.icon{font-size:72px;margin-bottom:24px}
h1{font-size:clamp(24px,5vw,32px);font-weight:800;margin-bottom:12px;letter-spacing:-0.5px}
p{font-size:16px;color:var(--text2);line-height:1.6;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,#0072BC,#00ADEE);color:#fff;border:none;cursor:pointer;transition:all 0.3s ease;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,114,188,0.4)}
.logo{max-width:180px;margin-bottom:32px}
.contact{margin-top:24px;font-size:14px;color:var(--text2)}
.contact a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<img src="/xamltech_addons_store/static/img/logo.png" alt="XamlTech" class="logo"/>
<div class="icon">📡</div>
<h1>You're Offline</h1>
<p>It looks like you've lost your internet connection. Don't worry — check your connection and try again.</p>
<button class="btn" onclick="window.location.reload()">🔄 Try Again</button>
<div class="contact">
<p>Need help? Call <a href="tel:+201007982468">+20 100 798 2468</a><br/>
or <a href="https://wa.me/201007982468">WhatsApp us</a></p>
</div>
</div>
</body>
</html>
