# posgo.xamltech.com - POS.Go product landing, APK download and the store API.
# Same upstream as api.xamltech.com (the Go app, bound to 127.0.0.1:8080).
# Surface routing is still disabled in the API (SURFACE_ROUTING_ENABLED=false),
# so this host currently serves the same routes as the console host; only the
# hostname differs. Security headers come from the app's SecurityHeaders
# middleware, so nginx adds only Referrer-Policy.
# Let's Encrypt cert managed by certbot (nginx plugin, certbot.timer renews).
#
# This is the file that is live in /etc/nginx on the production VPS. The prod
# edge is host nginx, not the containerised caddy service in
# docker-compose.prod.yml (caddy is not running there). Install it with:
#
#   install -m 644 deployments/nginx/posgo.xamltech.conf \
#       /etc/nginx/sites-available/posgo.xamltech.conf
#   ln -sfn /etc/nginx/sites-available/posgo.xamltech.conf \
#       /etc/nginx/sites-enabled/posgo.xamltech.conf
#   nginx -t && systemctl reload nginx
#   certbot certonly --nginx -d posgo.xamltech.com   # after the port-80 block
#
# The certificate must exist before the 443 block is enabled, or `nginx -t`
# fails on the missing files. Renewals run from certbot.timer; verify with
# `certbot renew --cert-name posgo.xamltech.com --dry-run`.
# /apk/ is served from a bind mount, not by the API: the installer has to be
# present at /var/www/apk/pos_go.apk, the name the landing page links to.

upstream posgo.xamltech.com {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name posgo.xamltech.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name posgo.xamltech.com;

    ssl_certificate     /etc/letsencrypt/live/posgo.xamltech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/posgo.xamltech.com/privkey.pem;  # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/posgo.xamltech.access.log;
    error_log  /var/log/nginx/posgo.xamltech.error.log;
    client_max_body_size 20M;
    proxy_read_timeout 30s;

    # Android app download: the signed APK built from the Flutter client.
    location /apk/ {
        alias /var/www/apk/;
        autoindex off;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=pos_go.apk" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://posgo.xamltech.com;
    }
}
