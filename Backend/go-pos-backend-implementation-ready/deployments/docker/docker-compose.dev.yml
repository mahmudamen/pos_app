# Development stack — the whole API stack runs in Docker, no host Go/Postgres/Redis needed.
# Usage (from the backend root):
#   docker compose -f deployments/docker/docker-compose.dev.yml up -d --build
# The source tree is bind-mounted so `docker compose restart api` reloads your code.
name: pos-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_app_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_app} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pos-dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: golang:1.23-alpine
    container_name: pos-dev-migrate
    working_dir: /app
    volumes:
      - ../..:/app
    command: >
      sh -c "go install github.com/pressly/goose/v3/cmd/goose@v3.21.1
      && goose -dir internal/infrastructure/database/migrations postgres \"$${DATABASE_URL}\" up"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pos_app}:${POSTGRES_PASSWORD:-pos_app_dev_password}@postgres:5432/${POSTGRES_DB:-pos}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: golang:1.23-alpine
    container_name: pos-dev-api
    working_dir: /app
    command: go run ./cmd/api
    volumes:
      - ../..:/app
    ports:
      - "0.0.0.0:${API_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-pos_app}:${POSTGRES_PASSWORD:-pos_app_dev_password}@postgres:5432/${POSTGRES_DB:-pos}
      REDIS_ADDR: redis:6379
      JWT_ISSUER: ${JWT_ISSUER:-pos-api}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-please-replace-long-enough}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-please-replace-long-enough}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: