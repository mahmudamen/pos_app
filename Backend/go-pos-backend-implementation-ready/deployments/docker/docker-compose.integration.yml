# Ephemeral integration-test dependency stack (real Postgres + Redis).
#
# Used by scripts/integration-test.sh. Pushes migrations and DB-backed tests
# through a throwaway Postgres on a non-conflicting host port so it can run
# alongside dev (`docker compose` in the repo root) and CI runners.
# Usage (from the backend root):
#   docker compose -f deployments/docker/docker-compose.integration.yml up -d --wait
name: pos-integration

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-integration-postgres
    environment:
      POSTGRES_DB: pos_test
      POSTGRES_USER: pos_app
      POSTGRES_PASSWORD: pos_app_test_password
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_app -d pos_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pos-integration-redis
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20