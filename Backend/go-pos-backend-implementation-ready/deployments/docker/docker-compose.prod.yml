# Production deployment stack — immutable API image, managed data volumes, Caddy TLS in front.
# Usage (from the backend root):
#   cp .env.prod.example .env.prod   # then set real secrets/domain
#   docker compose --env-file .env.prod -f deployments/docker/docker-compose.prod.yml up -d --build
name: pos-prod

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: pos-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_app} -d ${POSTGRES_DB:-pos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos_net

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: pos-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - pos_net

  migrate:
    image: pos-api:${IMAGE_TAG:-latest}
    container_name: pos-prod-migrate
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["goose", "-dir", "/app/migrations", "postgres", "postgres://${POSTGRES_USER:-pos_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pos}", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pos_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.prod}@postgres:5432/${POSTGRES_DB:-pos}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - pos_net

  api:
    image: pos-api:${IMAGE_TAG:-latest}
    container_name: pos-prod-api
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${APP_DB_USER:-pos_app}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.prod}}@postgres:5432/${POSTGRES_DB:-pos}
      REDIS_ADDR: redis:6379
      JWT_ISSUER: ${JWT_ISSUER:-pos-api}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required in .env.prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required in .env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in .env.prod}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - pos_net

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: pos-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${METRICS_PORT:-9090}:9090"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      SCRAPE_IP: ${SCRAPE_IP:-127.0.0.1}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - pos_net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  pos_net:
    driver: bridge