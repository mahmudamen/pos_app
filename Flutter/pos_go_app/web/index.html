<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="POS.Go — نقطة بيع تعمل دون اتصال، للمتاجر والمطاعم.">
  <meta name="theme-color" content="#13373f">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="POS.Go">
  <meta property="og:description" content="نقطة بيع تعمل دون اتصال، للمتاجر والمطاعم.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POS.Go">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>POS.Go</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until the Flutter engine paints its first frame, and left in place
       if the engine cannot start at all (no WebGL, blocked wasm): the POS is
       then unusable, so say so instead of showing a blank page. */
    html, body { margin: 0; height: 100%; background: #0d1b1f; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8f1f2;
      transition: opacity 240ms ease-out;
    }
    #boot img { width: 96px; height: 96px; border-radius: 24px; }
    #boot .label { font-size: 15px; letter-spacing: 0.02em; opacity: 0.75; }
    #boot.failed .label { opacity: 1; color: #ffb4ab; max-width: 30ch; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="POS.Go">
    <div class="label">جارٍ تشغيل POS.Go…</div>
  </div>

  <script>
    // The engine removes the splash once it renders. There is no "engine
    // failed" event, so a stalled load is covered by a timer: it only rewrites
    // the hint, because a slow device is indistinguishable from a dead engine
    // and the real cause (almost always WebGL being off) is the next thing to
    // try either way.
    (function () {
      var boot = document.getElementById('boot');
      var gone = false;
      window.addEventListener('flutter-first-frame', function () {
        gone = true;
        boot.style.opacity = '0';
        setTimeout(function () { boot.remove(); }, 240);
      });
      setTimeout(function () {
        if (gone) return;
        boot.querySelector('.label').textContent =
          'ما زال POS.Go يعمل… إن توقف عند هذه الشاشة، فعّل WebGL أو جرّب متصفحاً حديثاً.';
      }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
