name: pos_go_app
description: Offline-first POS client for the Go POS API.
publish_to: none
version: 1.1.1+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.0
  sqflite: ^2.3.3+1
  # Web counterpart of sqflite: sqlite3 compiled to WebAssembly, persisted in
  # IndexedDB. `dart run sqflite_common_ffi_web:setup` installs the sqlite3.wasm
  # + sqflite_sw.js binaries into web/.
  sqflite_common_ffi_web: ^1.2.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  image: ^4.10.1
  qr_flutter: ^4.1.0
  # Firebase. Only used for push: there is no Firestore or Firebase Auth here,
  # the POS keeps its own JWT auth and Postgres-backed store. Every call site
  # must go through lib/core/push.dart, which reports push as unavailable when
  # the app has no google-services.json rather than throwing -- that keeps
  # config-less builds (CI, fresh clones) working.
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/xamltech_logo.png
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/noto/NotoSerif-Regular.ttf
        - asset: assets/fonts/noto/NotoSerif-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto/NotoSans-Regular.ttf
        - asset: assets/fonts/noto/NotoSans-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/noto/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/noto/NotoKufiArabic-Regular.ttf
        - asset: assets/fonts/noto/NotoKufiArabic-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/noto/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/noto/NotoSansArabic-Bold.ttf
          weight: 700
